<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<title>Guida di casa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#1b1b1b; --muted:#4a4a4a; --line:#d9d3c7;
  --accent:#1f3b57; --accent-ink:#ffffff; --warn-bg:#fff1d6; --warn-line:#e0a526; --note-bg:#eef4fb;
  --ok:#2f7d55; --focus:#ffbf47; --fs:21px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --card:#20252b; --ink:#f2f2f2; --muted:#c9c9c9; --line:#3a424b;
    --accent:#8fb8e3; --accent-ink:#0f1c29; --warn-bg:#3b3020; --warn-line:#e0a526; --note-bg:#1d2a38;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --card:#20252b; --ink:#f2f2f2; --muted:#c9c9c9; --line:#3a424b;
  --accent:#8fb8e3; --accent-ink:#0f1c29; --warn-bg:#3b3020; --warn-line:#e0a526; --note-bg:#1d2a38;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header.top{background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
header.top h1{font-size:1.25rem;margin:0;flex:1;min-width:10em;cursor:pointer}
.sizer{display:flex;gap:6px}
.sizer button{background:transparent;border:2px solid currentColor;color:inherit;border-radius:10px;min-width:52px;min-height:48px;font-weight:700;cursor:pointer}
.sizer button[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:10px 22px;border-radius:14px;border:2px solid var(--accent);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:72px;font-size:1.1rem;flex:1}
.back{margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;min-height:200px;padding:18px;background:var(--card);border:3px solid var(--line);border-radius:22px;cursor:pointer;font-size:1.3rem;font-weight:800;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile .ic{width:96px;height:96px}
.ic.hdr{width:72px;height:72px;flex:none}
.tile small{font-size:.75rem;font-weight:500;color:var(--muted)}
.search{display:flex;gap:10px;margin:18px 0 8px}
.search input{flex:1;min-width:0;min-height:62px;border-radius:14px;border:3px solid var(--line);background:var(--card);padding:0 16px}
.search input:focus{border-color:var(--accent)}
h2{font-size:1.45rem;margin:10px 0 6px}
h3{font-size:1.15rem;margin:22px 0 10px}
.sub{color:var(--muted);margin:0 0 14px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin:14px 0 18px}
.tabs button{min-height:64px;border-radius:14px;border:3px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:16px;width:100%;text-align:left;min-height:76px;padding:12px 16px;background:var(--card);border:2px solid var(--line);border-radius:16px;cursor:pointer;font-weight:700}
.item:hover{border-color:var(--accent)}
.item .ic{width:56px;height:56px;flex:none}
.item .arrow{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.ic{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;border:1px solid #ddd;padding:6px;color:#111;overflow:hidden}
.ic img{max-width:100%;max-height:100%;display:block}
.ic svg{width:100%;height:100%;display:block}
.disp{display:inline-flex;align-items:center;justify-content:center;background:#111;color:#ff5a3c;font-family:"Courier New",monospace;font-weight:900;border-radius:8px;min-width:1.6em;padding:0 .2em;letter-spacing:.05em}
.keycap{display:inline-flex;align-items:center;justify-content:center;border:2.5px solid #222;border-radius:10px;padding:4px 8px;font-weight:800;color:#111;text-align:center;line-height:1.1;font-size:.8em}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:24px 18px}
.step .ic{width:170px;height:170px;padding:14px}
.step .count{font-weight:800;color:var(--muted);font-size:.9rem;letter-spacing:.04em}
.step .t{font-size:1.4rem;font-weight:800;margin:0}
.step .d{font-size:1.05rem;color:var(--muted);margin:0;max-width:34em}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dots span{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
.nav{display:flex;gap:12px;margin-top:16px}
.warn{background:var(--warn-bg);border-left:8px solid var(--warn-line);border-radius:12px;padding:14px 16px;margin:14px 0;font-weight:600}
.note{background:var(--note-bg);border-radius:12px;padding:14px 16px;margin:14px 0}
.src{display:inline-block;font-size:.8rem;color:var(--muted);margin-top:8px}
.speak{background:transparent;border:2px solid var(--line);border-radius:12px;min-height:52px;padding:6px 14px;cursor:pointer;font-weight:700}
details.faq{background:var(--card);border:2px solid var(--line);border-radius:16px;margin-bottom:10px}
details.faq summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:800;min-height:64px;display:flex;align-items:center;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:"?";flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:900}
details.faq[open] summary{border-bottom:2px solid var(--line)}
details.faq .ans{padding:14px 18px 16px}
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--card);margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--note-bg)}
tr:last-child td{border-bottom:0}
.prob{display:flex;gap:16px;align-items:flex-start}
.prob .code{flex:none;width:84px;display:flex;justify-content:center;font-size:1.3rem}
.prob .code .ic{width:80px;height:80px}
.prob>div{flex:1;min-width:0}
.ic .keycap{font-size:12px;padding:4px 5px;max-width:100%;white-space:normal;overflow-wrap:anywhere}
.step .ic .keycap{font-size:1.15rem;padding:8px 12px}
.tile .ic .keycap{font-size:16px}
.ic .disp{font-size:24px;line-height:1.25;min-width:1.3em}
.ic .disp.n{font-size:18px}
.step .ic .disp{font-size:68px}
.step .ic .disp.n{font-size:46px}
.ic.kc{width:auto!important;min-width:56px;max-width:150px}
.ic.kc .keycap{font-size:12px;padding:4px 6px}
.step .ic.kc{max-width:90%;min-width:170px}
.step .ic.kc .keycap{font-size:26px;padding:10px 16px}
.mock{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#111;font-weight:800;padding:4px;border-radius:8px;max-width:100%}
.mock b{display:block}
.mock.grid4{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%}
.mock.grid4 b{border:2px solid #bbb;border-radius:8px;padding:10px 2px;text-align:center}
.mock.rows{flex-direction:column;align-items:stretch;width:100%}
.mock.rows b{border:2px solid #bbb;border-radius:8px;padding:6px 8px}
.mock.dark{background:#1f3b57;color:#fff;padding:10px}
.mbtn{border:2px solid #1f3b57;border-radius:8px;padding:6px 8px;background:#fff;white-space:nowrap}
.mbtn.pri{background:#1f3b57;color:#fff}
.mbtn.inv{background:transparent;color:#fff;border-color:#fff}
.mbtn.lk{color:#111}
.step .ic .mock{font-size:18px}
.ic.wide{width:auto!important;min-width:56px}
.step .ic.uiw{width:92%;max-width:440px;height:auto;min-height:130px;padding:14px}
.prob.stack{flex-direction:column}
.prob.stack .code{width:100%;justify-content:flex-start}
.prob.stack .code .ic.uiw{width:100%;max-width:360px;height:auto;min-height:80px}
.no-flexgap .prob.stack>*+*{margin-left:0;margin-top:12px}
.welcome{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px 18px;margin-bottom:18px;border-radius:20px;border:3px solid var(--warn-line);background:var(--warn-bg);color:var(--ink);font-weight:800;font-size:1.15rem;cursor:pointer}
.welcome .ic{width:72px;height:72px;flex:none}
.welcome small{display:block;font-weight:500;font-size:.85rem;color:var(--muted)}
.grouph{margin:24px 0 10px;font-size:1.05rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.step .links{justify-content:center}
.lnk{min-height:54px;padding:8px 16px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--ink);font-weight:700;cursor:pointer;text-align:left}
.lnk::before{content:"→ ";color:var(--accent);font-weight:900}
.returnbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.flash{animation:flash 2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 6px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
.panelimg{background:#fff;border-radius:14px;padding:10px;border:2px solid var(--line);text-align:center}
.panelimg img{max-width:100%;height:auto}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.legend .ic{width:58px;height:58px;flex:none}
.contact{display:flex;flex-direction:column;gap:6px}
.contact a{font-size:1.3rem;font-weight:800;color:var(--accent)}
footer{color:var(--muted);font-size:.85rem;padding:24px 0 40px}
.hl{background:var(--warn-bg)}
@media (max-width:520px){
  .step .ic{width:130px;height:130px}
  .step .t{font-size:1.2rem}
  .nav{flex-direction:column-reverse}
}
.fig{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.fig h3{margin:0 0 10px}
.fig .imgbox{background:#fff;border-radius:12px;padding:8px;text-align:center;cursor:zoom-in;position:relative}
.fig .imgbox img{max-width:100%;height:auto;max-height:520px}
.fig .zoomhint{display:block;font-size:.8rem;color:#555;margin-top:4px}
.fig ol{list-style:none;padding:0;margin:12px 0 0;columns:2 16em}
.fig li{padding:6px 0;break-inside:avoid;font-weight:600}
.stepfig{margin-top:14px}
#zoom{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:50;display:none;overflow:auto;-webkit-overflow-scrolling:touch;padding:70px 10px 20px;text-align:center}
#zoom.on{display:block}
#zoom img{max-width:100%;background:#fff;border-radius:10px}
#zoom button{position:fixed;top:12px;right:12px;min-height:56px;padding:0 22px;border-radius:14px;border:0;background:#fff;color:#111;font-weight:800;font-size:1.1rem}
/* iPad/Safari più vecchi (prima di iOS 14.5) non conoscono "gap" nei flex */
.no-flexgap .item>*+*,.no-flexgap .legend div>*+*,.no-flexgap .prob>*+*,.no-flexgap .search>*+*,.no-flexgap .sizer>*+*{margin-left:12px}
.no-flexgap .nav>*+*{margin-left:12px}
.no-flexgap .list>*+*{margin-top:10px}
.no-flexgap .links>*{margin:0 10px 10px 0}
.no-flexgap .step>*+*{margin-top:16px}
.no-flexgap .tile>*+*{margin-top:12px}
.no-flexgap .welcome>*+*{margin-left:16px}
.no-flexgap .mock>*+*{margin-left:6px}
.no-flexgap header.top .wrap>*+*{margin-left:12px}
@media (max-width:520px){.no-flexgap .nav>*+*{margin-left:0;margin-bottom:12px}}
@media print{header.top,.tabs,.nav,.speak,.sizer,.back{display:none}}
</style>
</head>

function icon(key, cls){
  const [type, val] = [key.slice(0, key.indexOf(":")), key.slice(key.indexOf(":") + 1)];
  let inner = "";
  if (type === "img" && IMG[val]) inner = `<img src="${IMG[val]}" alt="">`;
  else if (type === "svg" && SVG[val]) inner = SVG[val];
  else if (type === "disp" || type === "txt") inner = `<span class="disp${val.length > 1 ? " n" : ""}">${esc(val)}</span>`;
  else if (type === "ui") inner = UI[val] || "";
  else if (type === "btn") { inner = `<span class="keycap">${esc(val)}</span>`; cls = (cls || "") + " kc"; }
  if (type === "ui") cls = (cls || "") + " uiw";
  return `<span class="ic ${cls||""}" aria-hidden="true">${inner}</span>`;
}
function target(A, t){
  const [k, v] = [t.split(":")[0], t.slice(t.indexOf(":") + 1)];
  if (k === "g") return v.indexOf("/") > 0 ? v.replace("/", "/guida/") : `${A.id}/guida/${v}`;
  if (k === "t") return `${A.id}/tabelle/${v}`;
  if (k === "q") return `${A.id}/domande/${v}`;
  if (k === "c") return `${A.id}/com/${v}`;
  if (k === "k") return `${A.id}/pannello`;
  if (k === "p") return `${A.id}/problemi`;
  return "";
}
function linksHtml(A, l){
  if (!l || !l.length) return "";
  return `<div class="links">${l.map(([label, t]) => `<button class="lnk" data-link="${esc(target(A, t))}">${esc(label)}</button>`).join("")}</div>`;
}
let backStack = [];
document.addEventListener("click", e => {
  const b = e.target.closest("[data-link]");
  if (!b) return;
  backStack.push(location.hash.replace(/^#/, ""));
  go(b.dataset.link);
});
function returnBar(){
  if (!backStack.length) return "";
  return `<div class="returnbar"><button class="btn primary" id="retbtn">‹ Torna dove eri</button></div>`;
}
const src = (app, p) => `<span class="src">📖 ${esc(app.manuale.split(" (")[0])}, pag. ${esc(p)}</span>`;

/* ---------- voce ---------- */
function speakBtn(text){
  if (!("speechSynthesis" in window)) return "";
  return `<button class="speak" data-say="${esc(text)}">🔊 Leggi ad alta voce</button>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (!b) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(b.dataset.say);
  u.lang = "it-IT"; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("it"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
});

/* ---------- grandezza testo ---------- */
function setFs(px){
  document.documentElement.style.setProperty("--fs", px + "px");
  document.querySelectorAll(".sizer button").forEach(b => b.setAttribute("aria-pressed", b.dataset.fs == px));
  try { localStorage.setItem("fs", px); } catch(_) {}
}
document.querySelectorAll(".sizer button").forEach(b => b.onclick = () => setFs(b.dataset.fs));
let savedFs = 21; try { savedFs = localStorage.getItem("fs") || 21; } catch(_) {}
setFs(savedFs);

/* ---------- navigazione ---------- */
const go = h => { location.hash = h; };
$("#home-link").onclick = () => go("");
$("#home-link").onkeydown = e => { if (e.key === "Enter") go(""); };
window.addEventListener("hashchange", render);

function render(route){
  if (typeof route !== "string") route = location.hash;
  $("#zoom").className = "";
  speechSynthesis && speechSynthesis.cancel && speechSynthesis.cancel();
  const parts = route.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const [a, view, id, step] = parts;
  if (!a) home();
  else if (a === "cerca") searchView(view || "");
  else if (a === "aiuto") helpView();
  else if (byId(a)) {
    if (a === "come" && view !== "guida") home();
    else if (view === "guida" && id) guideView(byId(a), id, +(step || 0));
    else appView(byId(a), view || "guide", id);
  } else home();
  if (backStack.length) {
    app.insertAdjacentHTML("afterbegin", returnBar());
    $("#retbtn").onclick = () => go(backStack.pop());
  }
  app.focus({ preventScroll: true });
  window.scrollTo(0, 0);
  const tgt = parts[2] && parts[1] !== "guida" && document.getElementById("x-" + parts[2]);
  if (tgt) {
    if (tgt.tagName === "DETAILS") tgt.open = true;
    setTimeout(() => { tgt.scrollIntoView({ block: "start" }); window.scrollBy(0, -80); tgt.classList.add("flash"); }, 30);
  }
}

function home(){
  backStack = [];
  app.innerHTML = `
    <button class="welcome" data-go="come/guida/uso/0">${icon("svg:help")}<span>Prima volta? Ecco come si usa questa guida<small>Tocca qui: bastano pochi minuti</small></span></button>
    <h2>Cosa vuoi usare?</h2>
    <div class="grid">
      ${APPS.map(a => `<button class="tile" data-go="${a.id}">${icon(a.icona)}<span>${esc(a.nome)}</span><small>${esc(a.modello)}</small></button>`).join("")}
    </div>
    <form class="search" id="sf" role="search">
      <input id="q" type="search" placeholder="Cerca: es. scongelare, E21, pirolisi…" aria-label="Cerca nella guida">
      <button class="btn primary" type="submit">Cerca</button>
    </form>
    <div class="grid" style="margin-top:16px">
      <button class="tile" data-go="aiuto" style="min-height:120px">${icon("svg:phone")}<span>Numeri di assistenza</span></button>
    </div>
    <footer>Tutte le informazioni vengono dai manuali d'uso degli elettrodomestici. Accanto a ogni risposta c'è la pagina del manuale.<br>Versione del ${esc(VERSIONE)}.</footer>`;
  bindGo();
  $("#sf").onsubmit = e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) go("cerca/" + encodeURIComponent(q)); };
}

function bindGo(){ app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go)); }

const TABS = [["guide","Cosa vuoi fare?"],["com","Com'è fatto"],["domande","Domande"],["problemi","Problemi"],["tabelle","Tabelle"],["pannello","I tasti"],["sicurezza","Sicurezza"]];

function appView(A, view, focusId){
  const tabs = TABS.filter(([k]) => k !== "problemi" || A.problemi.length).filter(([k]) => k !== "sicurezza" || A.sicurezza.length);
  let body = "";
  if (view === "guide") {
    const G = [["", "Le cose di tutti i giorni"], ["pulizia", "Pulizia"], ["altro", "Altre funzioni (servono di rado)"]];
    body = G.map(([k, h]) => {
      const list = A.guide.filter(g => (g.gruppo || "") === k);
      return list.length ? `<h3 class="grouph">${h}</h3><div class="list">${list.map(g => `<button class="item" data-go="${A.id}/guida/${g.id}">${icon(g.icona)}<span>${esc(g.titolo)}</span><span class="arrow">›</span></button>`).join("")}</div>` : "";
    }).join("");
  }
  if (view === "domande") body = A.faq.map(f => faqHtml(A, f)).join("");
  if (view === "problemi") body = `<div class="list">${A.problemi.map(p => `<div class="card prob">${p.codice ? `<span class="code">${icon(p.codice)}</span>` : `<span class="code">${icon("svg:warn")}</span>`}<div><strong>${esc(p.q)}</strong><div><em>Perché:</em> ${esc(p.causa)}</div><div><em>Cosa fare:</em> ${esc(p.rimedio)}</div>${linksHtml(A, p.l)}${src(A, p.p)}</div></div>`).join("")}</div>
    <div class="note">Se il problema non si risolve, chiama l'assistenza: <a href="#aiuto">numeri utili</a>. Non riparare da soli.</div>`;
  if (view === "tabelle") body = (A.funzioni ? funzioniHtml(A) : "") + Object.keys(A.tabelle).map(k => tableHtml(A, A.tabelle[k], k)).join("");
  if (view === "pannello") body = panelHtml(A);
  if (view === "com") body = (A.figure || []).map(f => figHtml(A, f)).join("");
  if (view === "sicurezza") body = `<div class="list">${A.sicurezza.map(s => `<div class="card prob"><span class="code">${icon("svg:warn")}</span><div>${esc(s.t)}<br>${src(A, s.p)}</div></div>`).join("")}</div>`;
  app.innerHTML = `
    <button class="btn back" data-go="">‹ Torna all'inizio</button>
    <div style="display:flex;align-items:center;gap:16px">${icon(A.icona,"hdr")}<div><h2 style="margin:0">${esc(A.nome)}</h2><p class="sub" style="margin:0">${esc(A.modello)}</p></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l]) => `<button role="tab" aria-selected="${k===view}" data-go="${A.id}/${k}">${l}</button>`).join("")}</div>
    ${body}`;
  bindGo();
}

function faqHtml(A, f, open){
  const l = (f.l || []).slice();
  if (f.tabella && A.tabelle[f.tabella] && !l.some(x => x[1] === "t:" + f.tabella)) l.unshift([A.tabelle[f.tabella].titolo, "t:" + f.tabella]);
  return `<details class="faq"${f.id ? ` id="x-${esc(f.id)}"` : ""}${open ? " open" : ""}><summary>${esc(f.q)}</summary><div class="ans"><p style="margin-top:0">${txt(f.a)}</p>
    ${linksHtml(A, l)}<p>${speakBtn(f.q + ". " + f.a)}</p>${src(A, f.p)}</div></details>`;
}
function tableHtml(A, t, key){
  return `<h3${key ? ` id="x-${esc(key)}"` : ""}>${esc(t.titolo)}</h3><div class="tablewrap"><table><thead><tr>${t.testa.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.righe.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${t.nota ? `<div class="note">${esc(t.nota)}</div>` : ""}${src(A, t.p)}`;

}

const findFig = (A, name) => (A.figure || []).find(f => f.img === name) || { img: name, titolo: "", p: "" };
document.addEventListener("click", e => {

document.addEventListener("keydown", e => { if (e.key === "Escape") $("#zoom").className = ""; });

function guideView(A, gid, step){
  const g = A.guide.find(x => x.id === gid);
  if (!g) return appView(A, "guide");
  const n = g.passi.length;
  const all = step === -1;
  const done = step >= n;
  let body;
  if (all) {
    body = `<div class="list">${g.passi.map((p, k) => `<div class="card prob${p.i.indexOf("ui:") === 0 ? " stack" : ""}"><span class="code">${icon(p.i)}</span><div><strong>${k+1}. ${esc(p.t)}</strong>${p.d ? `<div class="sub" style="margin:4px 0 0">${txt(p.d)}</div>` : ""}${p.f ? `<div class="fig stepfig">${figImg(p.f)}</div>` : ""}${linksHtml(A, p.l)}</div></div>`).join("")}</div>
      <div class="nav"><button class="btn big" data-go="${A.id}/guida/${g.id}/0">Passo per passo</button></div>`;
  } else if (done) {
    body = `<div class="card step"><span class="ic" style="border-color:var(--ok)"><svg viewBox="0 0 60 60" fill="none" stroke="#2f7d55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 32l12 12 24-26"/></svg></span><p class="t">Fatto!</p></div>
      <div class="nav"><button class="btn big" data-go="${A.id}/guida/${g.id}/0">↺ Ricomincia</button>${A.id === "come" ? `<button class="btn big primary" data-go="">🏠 Vai alla prima pagina</button>` : `<button class="btn big primary" data-go="${A.id}/guide">Altre guide</button>`}</div>`;
  } else {
    const p = g.passi[step];
    body = `<div class="card step" aria-live="polite">
        <span class="count">PASSO ${step+1} DI ${n}</span>
        <div class="dots">${g.passi.map((_, k) => `<span class="${k<=step?"on":""}"></span>`).join("")}</div>
        ${icon(p.i)}
        <p class="t">${esc(p.t)}</p>
        ${p.d ? `<p class="d">${txt(p.d)}</p>` : ""}
        ${linksHtml(A, p.l)}
        ${speakBtn(p.t + " " + (p.d || ""))}
      </div>
      ${p.f ? `<div class="fig stepfig">${figImg(p.f)}${findFig(A, p.f).legenda ? `<ol>${findFig(A, p.f).legenda.map(l => `<li>${esc(l)}</li>`).join("")}</ol>` : ""}</div>` : ""}
      <div class="nav">
        <button class="btn big" ${step===0?"disabled style='opacity:.4'":""} data-go="${A.id}/guida/${g.id}/${step-1}">‹ Indietro</button>
        <button class="btn big primary" data-go="${A.id}/guida/${g.id}/${step+1}">${step===n-1?"Finito ✓":"Avanti ›"}</button>
      </div>`;
  }
  app.innerHTML = `
    <button class="btn back" data-go="${A.id === "come" ? "" : A.id + "/guide"}">‹ ${A.id === "come" ? "Prima pagina" : esc(A.nome)}</button>
    <h2>${esc(g.titolo)}</h2>
    ${g.avviso && step <= 0 ? `<div class="warn">⚠️ ${esc(g.avviso)}</div>` : ""}
    ${g.intro && step <= 0 ? `<div class="note">${esc(g.intro)}</div>` : ""}
    ${g.attenzione && (step <= 0 || done) ? `<div class="warn">⚠️ ${esc(g.attenzione)}</div>${g.fig && step === 0 ? `<div class="fig">${figImg(g.fig)}</div>` : ""}` : ""}
    ${body}
    ${g.nota && (done || all || step === n-1) ? `<div class="note">${esc(g.nota)}</div>` : ""}
    ${g.l && (step <= 0 || done || all) ? `<h3>Collegati</h3>${linksHtml(A, g.l)}` : ""}
    ${g.tabella && (done || all) ? tableHtml(A, A.tabelle[g.tabella], g.tabella) : ""}
    ${!all && !done ? `<p><button class="btn" data-go="${A.id}/guida/${g.id}/-1">Vedi tutti i passi insieme</button></p>` : ""}
    ${g.p ? src(A, g.p) : ""}`;
  bindGo();
}

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function searchView(q){
  const words = norm(q).split(/\s+/).filter(Boolean);
  const hit = s => { const t = norm(s); return words.every(w => t.includes(w)); };
  const res = [];
  APPS.forEach(A => {
    A.guide.forEach(g => { if (hit(g.titolo + " " + (g.intro||"") + " " + g.passi.map(p => p.t + " " + (p.d||"")).join(" "))) res.push({ k: 0, A, html: `<button class="item" data-go="${A.id}/guida/${g.id}">${icon(g.icona)}<span>${esc(g.titolo)}<br><small class="sub">${esc(A.nome)} · guida</small></span><span class="arrow">›</span></button>` }); });
    A.faq.forEach(f => { if (hit(f.q + " " + f.a)) res.push({ k: 1, A, html: `<div><small class="sub">${esc(A.nome)}</small>${faqHtml(A, f)}</div>` }); });
    A.problemi.forEach(p => { if (hit(p.q + " " + p.causa + " " + p.rimedio)) res.push({ k: 2, A, html: `<div class="card prob"><span class="code">${icon(p.codice || "svg:warn")}</span><div><small class="sub">${esc(A.nome)}</small><br><strong>${esc(p.q)}</strong><div><em>Perché:</em> ${esc(p.causa)}</div><div><em>Cosa fare:</em> ${esc(p.rimedio)}</div>${src(A, p.p)}</div></div>` }); });
  });
  res.sort((x, y) => x.k - y.k);
  app.innerHTML = `
    <button class="btn back" data-go="">‹ Torna all'inizio</button>
    <form class="search" id="sf" role="search"><input id="q" type="search" value="${esc(q)}" aria-label="Cerca"><button class="btn primary">Cerca</button></form>
    <h2>${res.length ? `Ho trovato ${res.length} ${res.length===1?"risultato":"risultati"}` : "Nessun risultato"}</h2>
    ${res.length ? `<div class="list">${res.map(r => r.html).join("")}</div>` : `<div class="note">Prova con un'altra parola (es. "pulire", "bip", "torta", "E10"), oppure scegli l'elettrodomestico dalla pagina iniziale.</div>`}`;
  bindGo();
  $("#sf").onsubmit = e => { e.preventDefault(); const v = $("#q").value.trim(); if (v) go("cerca/" + encodeURIComponent(v)); };
}

function helpView(){
  const fam = FAMIGLIA.tel ? `<div class="card contact"><strong>${esc(FAMIGLIA.nome || "Famiglia")}</strong><a href="tel:${esc(FAMIGLIA.tel.replace(/\s/g,""))}">${esc(FAMIGLIA.tel)}</a></div>` : "";
  app.innerHTML = `
    <button class="btn back" data-go="">‹ Torna all'inizio</button>
    <h2>Numeri di assistenza</h2>
    <div class="list">${fam}${CONTATTI.map(c => `<div class="card contact"><strong>${esc(c.nome)}</strong><a href="tel:${esc(c.tel.replace(/\s/g,""))}">📞 ${esc(c.tel)}</a><span>${esc(c.note)}</span><span class="src">📖 ${esc(c.fonte)}</span></div>`).join("")}</div>`;
  bindGo();
}

render();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
